name: Hotfix overlap
on:
  pull_request:
  # An approval re-triggers this check, which is how a human clears an overlap.
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
  pull-requests: write
  statuses: write
jobs:
  # Deliberately NOT named "hotfix-overlap". The required check of that name is a
  # COMMIT STATUS this job posts, not this job's own check run.
  #
  # Why: a pull_request_review run creates a SECOND check run rather than replacing
  # the pull_request one, so two runs share the name and branch protection honours
  # the failing one. Commit statuses are last-write-wins per context, so a later
  # success genuinely overwrites an earlier failure.
  overlap-gate:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GCHAT_WEBHOOK: ${{ secrets.GCHAT_WEBHOOK_DEV }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail

          # Every PR must get this status, or the required check never reports and the
          # PR stays blocked forever.
          post() {
            gh api -X POST "/repos/$REPO/statuses/$HEAD_SHA" \
              -f state="$1" -f context=hotfix-overlap -f description="$2" >/dev/null
            echo "status: $1 - $2"
          }

          case "$HEAD_REF" in
            sync/pr-*) ;;
            *) post success "not a sync PR"; exit 0 ;;
          esac

          # A human approval on the CURRENT head clears the overlap gate. This is the
          # only escape hatch: without it, one open hotfix blocks every unrelated public
          # change to the same file until that hotfix is reconciled.
          # Comparing commit_id to the head SHA means a stale approval does not count,
          # whether or not "dismiss stale approvals" is enabled.
          APPROVALS=$(gh api "/repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq "[.[] | select(.state == \"APPROVED\" and .commit_id == \"$HEAD_SHA\")] | length")
          if [ "${APPROVALS:-0}" != "0" ]; then
            post success "overlap acknowledged by an approval"
            exit 0
          fi

          gh api "/repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
            | sort -u > /tmp/sync_files
          echo "sync PR files:"; cat /tmp/sync_files

          : > /tmp/hotfix_files
          # The issues API filters by label from the database. Do NOT use
          # "gh pr list --label": that goes through the search index, which lags
          # behind label changes by minutes and keeps blocking after a fix.
          for n in $(gh api "/repos/$REPO/issues?labels=pending-public-fix&state=all&per_page=100" \
                       --paginate --jq '.[] | select(.pull_request != null and .pull_request.merged_at != null) | .number'); do
            # Re-verify. The label filter above is served from an index that stays
            # stale for a long time after a label is removed, so a removed label
            # would otherwise keep blocking this sync PR indefinitely.
            gh api "/repos/$REPO/issues/$n/labels" --jq '.[].name' \
              | grep -qx 'pending-public-fix' || { echo "skip #$n: label already removed"; continue; }
            gh api "/repos/$REPO/pulls/$n/files" --paginate \
              --jq ".[] | \"\(.filename)\t$n\"" >> /tmp/hotfix_files
          done
          sort -u -o /tmp/hotfix_files /tmp/hotfix_files
          echo "hotfix files:"; cat /tmp/hotfix_files

          # Whole-file match.
          awk -F'\t' 'NR==FNR{h[$1]=h[$1]" #"$2; next} $1 in h {print $1 "\t" h[$1]}' \
            /tmp/hotfix_files /tmp/sync_files > /tmp/hits

          if [ ! -s /tmp/hits ]; then
            post success "no overlap with an open hotfix"
            exit 0
          fi

          TABLE=$(awk -F'\t' '{printf "| `%s` |%s |\n", $1, $2}' /tmp/hits)
          gh pr comment "$PR" --body "$(printf 'This sync PR changes files that are also changed by hotfixes still labelled `pending-public-fix`.\n\nCheck whether the two changes belong together. If the public version replaces the hotfix, reconcile to one copy, remove the label from the hotfix PR and close the hotfix issue. If they are unrelated, confirm they make sense side by side.\n\n**Approving this PR clears this check.**\n\n| File | Hotfix PR |\n|---|---|\n%s\n' "$TABLE")"

          gh pr edit "$PR" --add-label needs-hotfix-review

          for n in $(grep -oE '#[0-9]+' /tmp/hits | tr -d '#' | sort -u); do
            a=$(gh pr view "$n" --json author -q '.author.login' 2>/dev/null || true)
            [ -n "$a" ] && gh pr edit "$PR" --add-assignee "$a" || true
          done

          if [ -n "${GCHAT_WEBHOOK:-}" ]; then
            MSG=$(printf 'Sync PR #%s needs a hotfix review - overlapping hotfix PRs: %s\n%s/%s/pull/%s' \
                    "$PR" "$(grep -oE '#[0-9]+' /tmp/hits | sort -u | tr '\n' ' ')" \
                    "$SERVER" "$REPO" "$PR")
            curl -sS -X POST -H 'Content-Type: application/json' \
              -d "$(jq -n --arg t "$MSG" '{text:$t}')" "$GCHAT_WEBHOOK" >/dev/null
          fi

          # The status carries the verdict, so the job itself exits 0.
          post failure "overlaps an open hotfix - approve to clear"
