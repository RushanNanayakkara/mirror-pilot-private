name: Diag
on: workflow_dispatch
permissions:
  contents: write
  pull-requests: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          echo "### A. gh pr create (GraphQL createPullRequest)"
          git init -q /tmp/x 2>/dev/null
          gh pr create --repo "$REPO" --base main --head sync/pr-1 \
            --title "graphql probe" --body probe 2>&1 | tail -2

          echo
          echo "### B. gh pr merge --auto (GraphQL enablePullRequestAutoMerge)"
          gh pr merge 1 --repo "$REPO" --auto --merge 2>&1 | tail -3

          echo
          echo "### C. did auto-merge actually get enabled?"
          gh pr view 1 --repo "$REPO" --json autoMergeRequest -q '.autoMergeRequest'

          echo
          echo "### D. REST label + comment + assignee (used by hotfix-overlap)"
          curl -sS -o /dev/null -w 'label   HTTP %{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/1/labels" -d '{"labels":["conflict"]}'
          curl -sS -o /dev/null -w 'comment HTTP %{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/1/comments" -d '{"body":"diag comment"}'
          curl -sS -o /dev/null -w 'assign  HTTP %{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/1/assignees" -d '{"assignees":["RushanNanayakkara"]}'
