name: Diag
on: workflow_dispatch
permissions:
  contents: write
  pull-requests: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          echo "### token permissions as seen by the API"
          curl -sS -i -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO" \
            | grep -iE 'x-accepted-github-permissions|x-oauth-scopes|^HTTP'
          echo
          echo "### REST attempt to create the PR"
          curl -sS -i -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pulls" \
            -d '{"title":"diag","head":"sync/pr-1","base":"main","body":"diag"}' \
            | grep -iE '^HTTP|x-accepted-github-permissions|"message"|"documentation_url"'
